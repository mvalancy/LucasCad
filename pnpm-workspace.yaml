# Dependencies whose install scripts must run to produce working binaries.
# pnpm 11+ fails the install with ERR_PNPM_IGNORED_BUILDS unless they are
# approved here; `onlyBuiltDependencies` is the equivalent key for pnpm 10.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# Narrow security overrides for dependencies still pinned by upstream tooling.
# Recheck and remove as parent packages adopt these patched versions.
overrides:
  'esbuild@<0.28.1': 0.28.2
  'ws@>=8 <8.21.0': 8.21.0
  'undici@>=7 <7.29.0': 7.29.0
  'sharp@>=0.34 <0.35': 0.35.0
  'fast-uri@>=3 <3.1.6': 3.1.6
